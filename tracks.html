<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="tracks.css">
  <title>Tracklist | Masiha Favaran</title>
</head>

<body>

  <!-- MENU -->
  <div class="top-menu">
    <a href="index.html">بیوگرافی</a>
    <a href="tracks.html">لیست‌موزیک‌ها</a>
    <a href="album.html">آلبوم‌ها</a>
  </div>

  <!-- TITLE -->
  <h1>لیست موزیک</h1>
  <p>⭐️لیست‌تمام‌موزیک‌ها⭐️</p>

  <!-- TRACKS -->
  <div class="container" id="لیست موزیک"></div>

  <script>
  const data = [
  {
    title: "Amaghe Riye",
    cover: "Amaghe Riye.jpg",
    page: "Amaghe Riye.html"
    },
  {
    title: "Foroopashi",
    cover: "Foroopashi.png",
    page: "Foroopashi.html"
  },
  {
    title: "Rafti Ke Nabashi",
    cover: "CoverMusic.png",
    page: "track1.html"
  },
  {
    title: "Infidel Coward",
    cover: "CoverInfidelCoward.jpg",
    page: "track2.html"
  },
];
          
    const container = document.getElementById("لیست موزیک");

    data.forEach(t => {
      const div = document.createElement("div");
      div.className = "track";

      div.innerHTML = `
        <img class="cover" src="${t.cover}" alt="${t.title}">
        <div class="info">
          <div class="title">
            <a href="${t.page}">${t.title}</a>
          </div>
          <div class="btns">
            <a href="${t.page}">
              برای دانلود و پخش آنلاین کلیک کنید
            </a>
          </div>
        </div>
      `;

      container.appendChild(div);
    });
  </script>

</body>
</html>
