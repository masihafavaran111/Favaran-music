  </div></div><script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://mzavzvvyowlvechemkdo.supabase.co",
  "sb_publishable_HgJ3Y88QZRXOT976GJrjRg_XlPpUdg-"
);

const TRACK_ID = 6;
const STORAGE_KEY = "Hypnagogia_viewed";

async function addView() {

  if (localStorage.getItem(STORAGE_KEY)) {
    return;
  }

  const { data, error } = await supabase
    .from("tracks")
    .select("views")
    .eq("id", TRACK_ID)
    .single();

  if (error) {
    console.error("Error fetching track views:", error);
    return;
  }

  const { error: updateError } = await supabase
    .from("tracks")
    .update({
      views: (data.views || 0) + 1
    })
    .eq("id", TRACK_ID);

  if (updateError) {
    console.error("Error updating track views:", updateError);
    return;
  }

  localStorage.setItem(STORAGE_KEY, "true");
}

async function showViews() {

  const { data, error } = await supabase
    .from("tracks")
    .select("views")
    .eq("id", TRACK_ID)
    .single();

  if (error) {
    console.error("Error displaying track views:", error);

    document.getElementById("viewCount").textContent =
      "خطا در دریافت بازدید";

    return;
  }

  document.getElementById("viewCount").textContent =
    "بازدید: " + (data.views || 0);
}

(async () => {
  await addView();
  await showViews();
})();

</script></body>
